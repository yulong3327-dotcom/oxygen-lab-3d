<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f4">
  <title>实验台 · 化学实验室</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="./platform.css">
  <script src="../vendor/lucide.min.js" defer></script>
  <script type="importmap">
    { "imports": { "three": "../vendor/three-r160/three.module.min.js" } }
  </script>
  <script type="module" src="./player.js"></script>
</head>
<body class="player-shell">
  <header class="topbar">
    <a class="brand" href="./" aria-label="返回化学实验室目录"><span class="brand-icon"><i data-lucide="flask-conical" aria-hidden="true"></i></span><span>化学实验室</span></a>
    <span class="topbar-divider" aria-hidden="true"></span>
    <h1 id="experiment-title">实验台</h1>
  </header>
  <main id="player" class="player">
    <section class="stage" aria-label="3D 实验台">
      <canvas id="scene" aria-label="仪器模型与实验台"></canvas>
      <div class="scene-tools" role="group" aria-label="模型视角">
        <button id="turn-view" class="icon-button" type="button" aria-label="旋转视角" title="旋转视角" disabled><i data-lucide="rotate-cw" aria-hidden="true"></i></button>
        <button id="zoom-in" class="icon-button" type="button" aria-label="放大" title="放大" disabled><i data-lucide="zoom-in" aria-hidden="true"></i></button>
        <button id="zoom-out" class="icon-button" type="button" aria-label="缩小" title="缩小" disabled><i data-lucide="zoom-out" aria-hidden="true"></i></button>
        <button id="reset-view" class="icon-button" type="button" aria-label="恢复视角" title="恢复视角" disabled><i data-lucide="maximize" aria-hidden="true"></i></button>
      </div>
      <p id="load-status" class="load-status" role="status">正在加载 3D 模型…</p>
      <button id="target" class="scene-target" type="button" aria-label="放到目标位置" title="放到目标位置" hidden><i data-lucide="locate-fixed" aria-hidden="true"></i></button>
      <div id="instruments" class="instruments" role="group" aria-label="可选仪器"></div>
    </section>
    <aside class="inspector" aria-labelledby="steps-title">
      <p id="experiment-summary" class="experiment-summary"></p>
      <div class="inspector-heading">
        <h2 id="steps-title">实验步骤</h2>
        <output id="progress" aria-label="实验进度"></output>
      </div>
      <ol id="step-list" class="step-list"></ol>
      <p id="instruction" class="instruction" aria-live="polite"></p>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <div class="experiment-actions">
        <button id="demonstrate" type="button" disabled><i data-lucide="play" aria-hidden="true"></i>演示当前步骤</button>
        <button id="reset-experiment" type="button" disabled><i data-lucide="rotate-ccw" aria-hidden="true"></i>重做</button>
      </div>
    </aside>
  </main>
</body>
</html>
